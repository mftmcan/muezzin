name: Duyuru ve Izin Durumu Bildirimlerini Gonder

# Duyuru yayınlama (duyuruServisi.ts) ve izin kararı (useAdminIzinlerStore.ts
# izinGuncelle) istemci tarafında gerçekleşir — istemci Firebase SDK'sı FCM
# push GÖNDEREMEZ (yalnızca Admin SDK gönderebilir). Bu iş, "duyurular" ve
# "mazeretDurumu" bildirim tercihlerini (bkz. NotificationSettings.tsx)
# gerçekten push'a çeviren tek yer — mazeret-devirleri.yml'deki (her 10
# dakika) aynı sıklık deseni, ayrı bir dosyada (tek-iş-tek-workflow kuralı,
# bkz. diğer altı cron).
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Duyuru bildirimlerini gönder
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npm run process:duyuru-bildirimi
      - name: İzin durumu bildirimlerini gönder
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npm run process:izin-durum-bildirimi
      # Bu iş daha önce başarısız olup admin paneline "otomasyonHatasi"
      # uyarısı bırakmışsa, şimdi başarılıysa o uyarıyı otomatik çözer
      # (bkz. reportWorkflowSuccess.ts — "bilinçli olarak dışarıda
      # bırakılanlar" listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Duyuru ve İzin Durumu Bildirimlerini Gönder"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Duyuru ve İzin Durumu Bildirimlerini Gönder"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Duyuru ve İzin Durumu Bildirimlerini Gönder"
