name: Haftalik Plan Olustur

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * 0'

# Zamanlanmış Pazar koşusuyla bir workflow_dispatch (ya da "Re-run")
# çakışırsa haftalikPlanOlustur.ts'in `planDoc.exists` varlık kontrolü
# (TRANSACTION DEĞİL) iki süreçte de "plan yok" görebilir: aynı hafta için
# iki kez `adminUyarilari` belgesi (otomatik ID, dedup yok) ve iki kez
# "plan yayınlandı" FCM push'u üretilirdi. Diğer cron'lardaki AYNI desen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  planla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Planı oluştur
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npx tsx scripts/haftalikPlanOlustur.ts
      # Bu iş daha önce başarısız olup admin paneline "otomasyonHatasi"
      # uyarısı bırakmışsa, şimdi başarılıysa o uyarıyı otomatik çözer
      # (bkz. reportWorkflowSuccess.ts — "bilinçli olarak dışarıda
      # bırakılanlar" listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Haftalık Plan Oluştur"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Haftalık Plan Oluştur"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Haftalık Plan Oluştur"
