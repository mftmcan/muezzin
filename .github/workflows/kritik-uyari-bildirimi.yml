name: Kritik Uyari Bildirimlerini Gonder

# adminUyarilari'nda biriken kriz uyarıları (bkz. KrizAlarmlari.tsx) şu ana
# kadar yalnızca admin paneli AÇILDIĞINDA görünüyordu. Bu iş, çözülmemiş her
# uyarı için tüm aktif admin'lere FCM push gönderir (bkz.
# scripts/kritikUyariBildirimGonder.ts) — bildirim-gonder.yml'deki (duyuru/
# izin) AYNI sıklık deseninin yarısı: uyarılar zaten nadir ve acil olduğundan
# 30 dakika, 10 dakikadan daha uzun bir kabul edilebilir gecikme.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  kritik-uyari-bildirimi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Kritik uyarı bildirimlerini gönder
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npm run process:kritik-uyari-bildirimi
      # Bu iş daha önce başarısız olup admin paneline "otomasyonHatasi"
      # uyarısı bırakmışsa, şimdi başarılıysa o uyarıyı otomatik çözer
      # (bkz. reportWorkflowSuccess.ts).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Kritik Uyarı Bildirimlerini Gönder"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Kritik Uyarı Bildirimlerini Gönder"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Kritik Uyarı Bildirimlerini Gönder"
