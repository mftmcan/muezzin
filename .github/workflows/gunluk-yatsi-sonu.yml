name: Günlük Yatsı Sonu İşlemleri

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'

# Zamanlanmış koşuyla bir workflow_dispatch (ya da "Re-run") çakışırsa aylık
# adalet sayaçlarının (aylikVakitSayisi vb.) eşzamanlı okuma+yazma yarış
# durumuna düşmesini önler — increment() ile birlikte iki katmanlı savunma
# (premium hata analizi FR-K2, bkz. diğer iki cron'daki aynı desen).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  yatsi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Yatsı sonrası işlemleri çalıştır
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/yatsiSonuIslemleri.ts
      # Bu iş daha önce başarısız olup admin paneline "otomasyonHatasi"
      # uyarısı bırakmışsa, şimdi başarılıysa o uyarıyı otomatik çözer
      # (bkz. reportWorkflowSuccess.ts — "bilinçli olarak dışarıda
      # bırakılanlar" listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Günlük Yatsı Sonu İşlemleri"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Günlük Yatsı Sonu İşlemleri"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Günlük Yatsı Sonu İşlemleri"
