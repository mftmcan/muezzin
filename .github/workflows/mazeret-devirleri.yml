name: Mazeret ve Vekalet Devirlerini Uzlaştır

on:
  workflow_dispatch:
  schedule:
    # Mazeret bildirimi sonrası haftaPlanlari senkronu ve (yedek bulunamazsa)
    # admin alarmı, istemcinin yapamadığı admin-SDK işlemlerdir; bu iş bunları
    # kısa aralıklarla uzlaştırır. GitHub Actions cron'unun birkaç dakika
    # gecikmesi normaldir.
    - cron: '*/10 * * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  uzlastir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Mazeret devirlerini uzlaştır
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npm run process:mazeret-devirleri
      - name: Vekalet devirlerini uzlaştır
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npm run process:vekalet-devirleri
      # 1 saatlik mazeret/vekalet penceresinin SUNUCU tarafı zorlayıcısı,
      # bildirim belgesindeki `mazeretSonBasvuru` damgasıdır (bkz.
      # firestore.rules `mazeretPenceresiAcik`) ve damga yoksa kural
      # FAIL-CLOSED davranır. Bu adım, plan üretilirken ezan verisi henüz
      # olmayan (3 hafta ileri planlanan) günlerin damgasını veri geldiğinde
      # tamamlar — aksi halde o günlerde mazeret/vekalet kalıcı olarak kapalı
      # kalırdı. Aynı 10 dakikalık ritimde çalışması kasıtlı: kullanıcı en
      # fazla bir cron turu bekler.
      - name: Mazeret penceresi damgalarını tamamla
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npm run process:mazeret-penceresi
      # Bu iş daha önce başarısız olup admin paneline "otomasyonHatasi"
      # uyarısı bırakmışsa, şimdi başarılıysa o uyarıyı otomatik çözer
      # (bkz. reportWorkflowSuccess.ts — "bilinçli olarak dışarıda
      # bırakılanlar" listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Mazeret ve Vekalet Devirlerini Uzlaştır"
      - name: Başarısızlığı admin paneline bildir
        # NOT: diğer altı cron'dan farklı olarak bu adım önceden hiç yoktu —
        # bu iş sessizce günlerce başarısız kalabilirdi (bkz. Firebase/GitHub
        # veri akışı denetimi). Sorgular artık son 30 günle sınırlı olduğu
        # için (bkz. mazeretDevirleriniIsle.ts/vekaletDevirleriniIsle.ts)
        # uzun süreli sessiz bir kesinti artık pencere dışına düşen eski
        # kayıtları hiç uzlaştırmadan bırakabilir — bu adım bu riski azaltır.
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Mazeret ve Vekalet Devirlerini Uzlaştır"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Mazeret ve Vekalet Devirlerini Uzlaştır"
