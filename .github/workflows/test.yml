name: CI Test Suite

# `build_and_deploy` job'ı `test` job'ına `needs:` ile bağlı ve YALNIZCA
# main'e push testlerden geçtiyse deploy eder. Bu, firestore.rules gibi
# güvenlik açısından kritik dosyaların test edilmeden production'a
# çıkmasını engeller. Önceden ayrı bir deploy.yml, workflow_run ile bu
# workflow'un `name:` alanına göre (dosya adına değil) eşleşiyordu — bu isim
# değiştirilirse deploy zinciri sessizce kopardı. Aynı workflow içinde
# job-to-job `needs:` bağımlılığı bu kırılganlığı ortadan kaldırır.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Yalnızca bu TEST job'unu kapsar — `build_and_deploy`'un kendi
    # `deploy-production` grubu (cancel-in-progress:false) ayrı ve
    # dokunulmadı. Aynı ref'e art arda push'landığında (ör. bir düzeltme
    # commit'i hemen ardından gelir) önceki, artık geçersiz commit'in test
    # koşusu ~10-15 dk boyunca gereksiz yere sonuna kadar çalışıyordu — bir
    # oturumda birkaç kez gözlemlendi (bkz. 2026-09-15 CI koşu geçmişi).
    # İptal edilen bir test job'u `needs: test`'i sağlamadığından o commit'in
    # deploy'u da başlamaz; zaten sonraki push onu geçersiz kılmıştı.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # firebase-tools artık Auth emülatörü için JDK 21+ istiyor.
          java-version: '21'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Run rules & smoke tests
        run: npm run test:all

      - name: Run Playwright E2E tests (against Firestore + Auth emulators)
        run: firebase emulators:exec --only firestore,auth --project ezanmerkezi "npx playwright test"

      # E2E başarısız olduğunda trace.zip/error-context.md indirilemiyordu —
      # kök nedeni yalnızca CI loglarındaki metinden tahmin etmek gerekiyordu
      # (bkz. mazeret-flow.spec.ts flakiness soruşturması). Yalnızca hata
      # durumunda yükleniyor, her yeşil koşuda gereksiz depolama harcamıyor.
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build_and_deploy:
    name: Build & Deploy to Firebase
    needs: test
    # `environment: production` GitHub'ın deployment protection rules'ını
    # devreye sokar — Settings → Environments → production → Required
    # reviewers yapılandırılırsa, bu job onay verilene kadar HİÇBİR adımı
    # çalıştırmaz (SA anahtarı runner'a hiç inmez). Public repoda bu ücretsiz
    # (bkz. docs/RUNBOOK.md §6). Reviewer ayarı burada değil, GitHub UI'da
    # yapılır — bu satır tek başına onay zorunluluğu getirmez, environment
    # ayarı yapılana kadar eskisi gibi otomatik deploy eder.
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT: ezanmerkezi
      # .firebaserc'de `hosting.site` yok → varsayılan site = proje ID'si.
      HOSTING_SITE: ezanmerkezi
      HOSTING_URL: https://ezanmerkezi.web.app
    # Yalnızca "Deploy'u etiketle" adımının git tag push edebilmesi için —
    # varsayılan GITHUB_TOKEN izinleri repo ayarına göre salt-okuma olabilir
    # (bkz. docs/RUNBOOK.md, rollback prosedürü bu tag'lere bağlı).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # Vite VITE_* değişkenlerini build zamanında gömer; secret GitHub
          # repo ayarlarında tanımlı değilse push bildirimleri sessizce
          # devre dışı kalır (bkz. src/hooks/useFcmToken.ts).
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
          # Tanımsızsa App Check istemci tarafında hiç başlatılmaz (bkz.
          # src/lib/firebase.ts) — eksik olması derlemeyi kırmaz, yalnızca
          # App Check pasif kalır.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      # vite.config.ts'te sourcemap:'hidden' — .map dosyaları dist/'te üretilir
      # ama firebase.json'un hosting.ignore'u nedeniyle Firebase Hosting'e
      # deploy EDİLMEZ. DİKKAT: bu, "public'e hiç sızmaz" anlamına gelmiyordu
      # — bu repo zaten public olduğundan (bkz. kök CLAUDE.md) GitHub Actions
      # artifact'ları da repoyu okuyabilen HERKESE açıktır; ama gerçek kaynak
      # kod da (TypeScript, tüm iş kuralları) zaten aynı public repo'da git
      # geçmişinden okunabilir olduğundan bu artifact'in ek olarak açığa
      # çıkardığı tek şey, üretim BUILD'inin minified→orijinal eşlemesidir
      # (premium hata analizi FR-O7 — ciddiyet, ilk değerlendirmenin
      # varsaydığından düşük). Yine de saklama süresi gereksiz uzun
      # tutulmasın diye kısaltıldı — prod'daki bir hatanın stack trace'ini
      # ayıklamak için bu artifact'i indirip yerel source-map araçlarıyla
      # eşlemek gerekir.
      # v4 idi — aynı dosyadaki diğer upload-artifact adımı (Playwright
      # trace) zaten v7 kullanıyordu. v7'nin `name`/`path`/`retention-days`
      # girdileri v4 ile birebir uyumlu (doğrulandı), sürüm hizalandı.
      - name: Upload source maps (debug artifact, not deployed)
        uses: actions/upload-artifact@v7
        with:
          name: sourcemaps-${{ github.sha }}
          path: dist/**/*.map
          retention-days: 14
      # ÜÇÜNCÜ TARAF ACTION KALDIRILDI. Eskiden bu adım
      # `w9jds/firebase-action@0134e55e...` (# v15.23.0) kullanıyordu. Action
      # git SHA'sına sabitlenmişti, ama bir "docker" action olduğu için asıl
      # kodu Docker Hub'daki DEĞİŞTİRİLEBİLİR bir imaj tag'inden
      # (`w9jds/firebase-action:v15.23.0`) çekiyordu — SHA pin'i yalnızca
      # action.yaml/entrypoint.sh'i sabitliyordu, imajı değil. Bu adım
      # `GCP_SA_KEY` ile TAM servis hesabı anahtarını o imaja veriyordu; tag
      # başka bir digest'e taşınsaydı kimlik bilgisi sessizce dışarı
      # sızdırılabilirdi. Artık üçüncü taraf kod yok: entrypoint.sh'in yaptığı
      # iş birebir aşağıya taşındı ve `firebase` CLI'ı bu repo'nun ZATEN
      # devDependency olarak tuttuğu `firebase-tools` kurulumundan
      # çalıştırılıyor (sürüm package-lock.json ile sabit; yukarıdaki
      # `npm ci` adımı onu zaten kurmuş oluyor). Böylece deploy yolunda
      # ikinci, izlenmeyen bir sürüm pin'i kalmıyor.
      #
      # Upstream entrypoint.sh (0134e55e) ile davranış eşlemesi:
      #   - `GCP_SA_KEY` geçerli JSON ise doğrudan, değilse base64 çözülerek
      #     bir dosyaya yazılırdı. Secret'ın hangi biçimde saklandığı repo'dan
      #     görünmediği için İKİ BİÇİM DE korundu (aynı ikili biçim desteği
      #     scripts/lib/firebaseAdminInit.ts içinde de var).
      #   - `GOOGLE_APPLICATION_CREDENTIALS` o dosyaya işaret ederdi; firebase
      #     CLI kimliği ADC üzerinden alır — burada da aynısı.
      #   - `PROJECT_ID` orada `firebase use --add` ile ayarlanıyordu; burada
      #     `--project` bayrağı kullanılıyor (aynı etki, `.firebaserc`'i
      #     değiştirmediği için daha temiz — zaten default: ezanmerkezi).
      #   - entrypoint `set -e` ile başlıyordu; burada Actions'ın `run:` için
      #     varsayılan `bash -eo pipefail`'i aynı işi görüyor: `firebase
      #     deploy` sıfırdan farklı dönerse adım ve job BAŞARISIZ olur
      #     (bu job'da `continue-on-error` YOK).
      # Anahtar ASLA log'a yazılmaz: `printf` çıktısı hep bir dosyaya/boruya
      # gider, doğrulama hatasının stderr'i bastırılır (JSON.parse hata mesajı
      # anahtarın bir parçasını log'a düşürebilir — bkz. firebaseAdminInit.ts
      # içindeki aynı gerekçe), dosya `mktemp` ile 0600 izniyle açılır.
      # Deploy artık tek bir `firebase deploy` değil, aşağıdaki çok adımlı
      # zincir olduğundan (önizleme → doğrula → terfi → doğrula → gerekirse
      # geri al) anahtar dosyası bu adımda `trap EXIT` ile silinmez; yolu
      # `GITHUB_ENV` üzerinden sonraki adımlara geçer ve job'un sonundaki
      # `if: always()` "Servis hesabı anahtarını sil" adımı onu kaldırır
      # (RUNNER_TEMP job bitince zaten atılır — bu ek bir güvence).
      #
      # YEREL ÇALIŞTIRMA KORUMASI (bu bloğun İLK satırları, her şeyden önce).
      # Gerekçe: bu adımın gövdesi düz bir bash script'i olduğu için bir
      # insan ya da bir ajan "değişikliğimi doğrulayayım" diye onu kopyalayıp
      # yerel kabukta çalıştırabiliyor. Bir kez gerçekten oldu: `firebase
      # deploy` satırını stub'lamaya çalışan regex eşleşmedi ve GERÇEK
      # `firebase deploy --project ezanmerkezi` komutu yerelde, sahte bir
      # servis hesabı anahtarıyla PRODUCTION projesine karşı çalıştı
      # (kimlik bilgisi çöp olduğu için proje-erişim ön koşulunda düştü,
      # hiçbir şey yazılmadı — ama komut gerçekten canlı projeye ulaştı).
      # `GITHUB_ACTIONS` ve `CI` değişkenlerini kullanıcı/script değil,
      # Actions platformunun kendisi her adımın ortamına enjekte eder
      # (GitHub "default environment variables" — hem GitHub-hosted hem
      # self-hosted runner'da her zaman "true"), dolayısıyla gerçek CI
      # yolunda bu kontrol tam bir no-op'tur; yalnızca Actions dışında
      # çalıştırıldığında ateşler. FAIL-CLOSED: değişken tanımsızsa
      # (`:-` ile boş dizgeye düşer) "true" olmadığı için reddedilir.
      - name: Servis hesabı anahtarını hazırla
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: |
          if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ "${CI:-}" != "true" ]; then
            echo "::error::Bu script sadece gercek GitHub Actions calistiricisinda calismalidir. Yerel/manuel calistirma REDDEDILDI (guvenlik: production deploy korumasi)."
            exit 1
          fi
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI secret'i bos veya tanimsiz - deploy edilemez."
            exit 1
          fi
          CRED_FILE="$(mktemp "${RUNNER_TEMP}/gcp-sa-key-XXXXXXXXXX.json")"
          chmod 600 "$CRED_FILE"
          case "$GCP_SA_KEY" in
            \{*) printf '%s' "$GCP_SA_KEY" > "$CRED_FILE" ;;
            *)   printf '%s' "$GCP_SA_KEY" | base64 -d > "$CRED_FILE" ;;
          esac
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$CRED_FILE" 2>/dev/null || {
            rm -f "$CRED_FILE"
            echo "::error::Servis hesabi anahtari gecerli JSON olarak cozulemedi (ayrinti, sir sizintisini onlemek icin bilincli olarak loglanmiyor)."
            exit 1
          }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED_FILE" >> "$GITHUB_ENV"
          echo "ONIZLEME_KANALI=ci-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      # DEPLOY ZİNCİRİ: önizleme → doğrula → terfi → doğrula → (gerekirse)
      # geri al. Eskiden tek `firebase deploy --only hosting,...` canlıyı
      # doğrudan değiştiriyordu ve "komut sıfır döndü" tek başarı ölçütüydü —
      # bozuk bir build (eksik asset, yanlış header, CDN'in eski sürümü
      # sunması) fark edilmeden canlıda kalıyordu.
      #
      # 1) Build önce kısa ömürlü bir ÖNİZLEME kanalına yüklenir (canlı
      #    dokunulmaz). `--no-authorized-domains`: CLI varsayılan olarak her
      #    önizleme URL'sini Firebase Auth "authorized domains" listesine
      #    EKLER — her deploy'da production Auth yapılandırmasına kalıcı bir
      #    domain girmesin diye kapalı (bu URL'de giriş zaten gerekmiyor,
      #    sağlık kontrolü yalnızca HTTP düzeyinde).
      # 2) Önizleme URL'sinde scripts/hostingSaglikKontrolu.ts: build'e gömülü
      #    commit SHA'sı (dist/version.json, bkz. vite.config.ts) + ana JS
      #    chunk + manifest + sw gerçekten servis ediliyor mu. Geçmezse canlı
      #    hiç değişmeden job biter.
      # 3) Canlının MEVCUT hosting sürüm ID'si kaydedilir (rollback hedefi) —
      #    bulunamazsa geri alma yolu olmayacağı için FAIL-CLOSED durulur.
      # 4) firestore rules + indexes deploy edilir (hosting terfisinden hemen
      #    önce ki istemci ile kurallar mümkün olduğunca aynı anda değişsin).
      # 5) Önizleme sürümü `hosting:clone` ile canlıya terfi eder (aynı
      #    dosyalar yeniden yüklenmez, yalnızca yeni bir release oluşur).
      # 6) Canlıda aynı sağlık kontrolü, CDN yayılımı için daha uzun
      #    deneme/bekleme ile.
      # 7) 5 ya da 6 başarısızsa canlı, 3'te kaydedilen sürüme geri alınır ve
      #    geri almanın gerçekten uygulandığı `hosting:channel:list` ile API
      #    düzeyinde teyit edilir. YALNIZCA hosting geri alınır — HTTP sağlık
      #    kontrolü bir rules sorununu zaten tespit edemez, rules geri alma
      #    docs/RUNBOOK.md §2'deki gibi elle/git tag üzerinden yapılır.
      - name: Önizleme kanalına deploy
        id: onizleme
        run: |
          # --json: stdout'a yalnızca {status,result|error} yazılır, konsol
          # logger'ı kapanır (firebase-tools bin/cli.js) — hata mesajı bu
          # yüzden dosyadan basılıyor, yoksa yalnızca "exit code 1" görünürdü.
          if ! ./node_modules/.bin/firebase hosting:channel:deploy "$ONIZLEME_KANALI" \
              --expires 1h --no-authorized-domains \
              --project "$FIREBASE_PROJECT" --json > "$RUNNER_TEMP/onizleme.json"; then
            echo "::error::Onizleme kanalina deploy basarisiz: $(jq -r '.error // "bilinmeyen hata"' "$RUNNER_TEMP/onizleme.json" 2>/dev/null)"
            exit 1
          fi
          URL="$(jq -r '.result | to_entries[0].value.url // empty' "$RUNNER_TEMP/onizleme.json")"
          if [ -z "$URL" ]; then
            echo "::error::Onizleme kanali URL'si CLI ciktisindan okunamadi."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Önizleme: $URL"

      - name: Önizlemede sağlık kontrolü
        env:
          ONIZLEME_URL: ${{ steps.onizleme.outputs.url }}
          SAGLIK_DENEME: '6'
          SAGLIK_BEKLEME_MS: '5000'
        run: npx tsx scripts/hostingSaglikKontrolu.ts "$ONIZLEME_URL" "$GITHUB_SHA"

      - name: Canlı sürümü kaydet (rollback hedefi)
        id: onceki
        run: |
          if ! ./node_modules/.bin/firebase hosting:channel:list \
              --site "$HOSTING_SITE" --project "$FIREBASE_PROJECT" --json > "$RUNNER_TEMP/kanallar.json"; then
            echo "::error::Kanal listesi alinamadi: $(jq -r '.error // "bilinmeyen hata"' "$RUNNER_TEMP/kanallar.json" 2>/dev/null)"
            exit 1
          fi
          SURUM="$(jq -r '.result.channels[] | select(.name | endswith("/channels/live")) | .release.version.name // empty | split("/") | last' "$RUNNER_TEMP/kanallar.json")"
          if [ -z "$SURUM" ]; then
            echo "::error::Canlinin mevcut hosting surumu bulunamadi - geri alma hedefi olmadan terfi edilmez."
            exit 1
          fi
          echo "surum=$SURUM" >> "$GITHUB_OUTPUT"
          echo "Rollback hedefi: $HOSTING_SITE@$SURUM"

      - name: Firestore rules + indexes deploy
        run: |
          ./node_modules/.bin/firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT"

      - name: Canlıya terfi ettir
        id: terfi
        run: |
          ./node_modules/.bin/firebase hosting:clone \
            "$HOSTING_SITE:$ONIZLEME_KANALI" "$HOSTING_SITE:live" \
            --project "$FIREBASE_PROJECT"

      - name: Canlıda sağlık kontrolü
        id: canli_saglik
        env:
          SAGLIK_DENEME: '12'
          SAGLIK_BEKLEME_MS: '5000'
        run: npx tsx scripts/hostingSaglikKontrolu.ts "$HOSTING_URL" "$GITHUB_SHA"

      - name: Otomatik geri alma (hosting)
        if: failure() && (steps.terfi.outcome == 'failure' || steps.canli_saglik.outcome == 'failure')
        env:
          ONCEKI_SURUM: ${{ steps.onceki.outputs.surum }}
        run: |
          echo "::warning::Canli dogrulanamadi; hosting $HOSTING_SITE@$ONCEKI_SURUM surumune geri aliniyor."
          ./node_modules/.bin/firebase hosting:clone \
            "$HOSTING_SITE@$ONCEKI_SURUM" "$HOSTING_SITE:live" \
            --project "$FIREBASE_PROJECT"
          ./node_modules/.bin/firebase hosting:channel:list \
            --site "$HOSTING_SITE" --project "$FIREBASE_PROJECT" --json > "$RUNNER_TEMP/kanallar-sonra.json"
          CANLI="$(jq -r '.result.channels[] | select(.name | endswith("/channels/live")) | .release.version.name // empty | split("/") | last' "$RUNNER_TEMP/kanallar-sonra.json")"
          if [ "$CANLI" != "$ONCEKI_SURUM" ]; then
            echo "::error::GERI ALMA DOGRULANAMADI - canli su an '$CANLI' surumunde, beklenen '$ONCEKI_SURUM'. Elle mudahale gerekli (docs/RUNBOOK.md §1)."
            exit 1
          fi
          {
            echo "## Deploy geri alındı"
            echo "- Commit \`$GITHUB_SHA\` canlıda doğrulanamadı; hosting \`$ONCEKI_SURUM\` sürümüne geri alındı ve teyit edildi."
            echo "- firestore.rules/indexes YENİ sürümde kaldı — gerekiyorsa docs/RUNBOOK.md §2."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Deploy basarisiz: canli onceki surume geri alindi (hosting). Ayrintilar icin yukaridaki saglik kontrolu adimina bakin."

      - name: Önizleme kanalını sil
        if: always() && env.ONIZLEME_KANALI != ''
        continue-on-error: true
        run: |
          ./node_modules/.bin/firebase hosting:channel:delete "$ONIZLEME_KANALI" \
            --site "$HOSTING_SITE" --force --project "$FIREBASE_PROJECT"

      - name: Servis hesabı anahtarını sil
        if: always() && env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # Deploy BAŞARILI olduktan SONRA (önceki adımlardan biri başarısız
      # olursa buraya hiç gelinmez — geri alma yolu dahil) — her production
      # deploy'unun hangi commit'e karşılık geldiğini işaretler. Rollback
      # prosedürü (docs/RUNBOOK.md § 2) "son bilinen iyi" firestore.rules
      # sürümünü bulmak için bu tag'lere bakar. Ayrı bir GitHub Release
      # AÇILMAZ — yalnızca hafif bir git tag, gürültü/bildirim üretmez.
      - name: Deploy'u etiketle
        run: |
          TAG="release-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          {
            echo "## Deploy tamamlandı"
            echo "- Commit \`$GITHUB_SHA\` → $HOSTING_URL (sağlık kontrolü geçti)"
            echo "- Git tag: \`$TAG\`"
            echo "- Önceki hosting sürümü (elle geri alma için): \`${{ steps.onceki.outputs.surum }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
