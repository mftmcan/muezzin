name: Hata Esigi Kontrolu

# En-az-ayrıcalık: salt-okuma cron — GITHUB_TOKEN yalnızca actions/checkout
# için kullanılıyor, git push / gh CLI / PR yorumu / tag YOK. Firestore
# okuma/uyarı yazımı Admin SDK kimliğiyle (FIREBASE_SERVICE_ACCOUNT_KEY) yapılır.
permissions:
  contents: read
  id-token: write

# İstemci tarafında (src/services/telemetryService.ts) aynı imzalı bir
# hatanın çok sayıda FARKLI oturumda anormal tekrarını erken yakalar (bkz.
# scripts/hataEsigiKontrol.ts başındaki gerekçe) — kota-kontrol.yml ile AYNI
# "erken uyarı, iş hatası değil" felsefesi. 6 saatlik cadence: günlük
# (kota-kontrol.yml) kadar seyrek değil, proaktif bir uyarı için yeterli.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hata-esigi-kontrolu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Google Cloud kimliğini OIDC ile al
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT_AUTOMATION != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_AUTOMATION }}
          create_credentials_file: true
      - name: Paketleri kur
        run: npm ci
      - name: Hata tekrar eşiğini kontrol et
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        # Script eşik aşımında BAŞARISIZ OLMAZ (uyarıyı kendisi
        # adminUyarilari'na yazar) — buradaki failure() dalı yalnızca
        # gerçek script/altyapı hataları için.
        run: npm run hata:esigi-kontrol
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Hata Eşiği Kontrolü"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EZANMERKEZI }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Hata Eşiği Kontrolü"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Hata Eşiği Kontrolü"
