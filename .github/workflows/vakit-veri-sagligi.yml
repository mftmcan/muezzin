name: Vakit Veri Sağlığı Kontrolü

# Aylık takvim güncellemesi (aylik-ezan-takvimi.yml) yalnızca ayda bir
# çalışır; aradaki bir hata veya yanlış dokümana yazma durumu fark
# edilmeden günlerce sürebilir (bkz. 2026-07-30 kesintisi). Bu iş her gün
# bugün/yarın verisinin eksiksiz olduğunu doğrular, eksikse API'den
# tazeler ve admin paneline iz bırakır.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # 01:00 Türkiye saati — gece yarısı geçişinden hemen sonra

# Çakışan iki koşu, `bugunIcinApiHatasiUyarisiVarMi` dedup'ını (sorgu +
# ayrı yazım, transaction değil) ikisi de "uyarı yok" görerek atlatıp aynı
# gün için iki `adminUyarilari` belgesi üretir. Diğer cron'lardaki AYNI desen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  saglik-kontrolu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Vakit verisi sağlığını kontrol et
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        # NOT: DIYANET_API_EMAIL/PASSWORD burada BİLİNÇLİ OLARAK geçirilmiyor —
        # bu script günlük çalışıyor, resmi API'yi kullansaydı bir kesinti
        # sırasında aylık kotayı hızla tüketirdi (bkz.
        # scripts/lib/diyanetResmiApi.ts). Resmi API yalnızca aylık cron'da.
        run: npx tsx scripts/vakitVeriSagligiKontrol.ts
      # Bu iş daha önce (script/altyapı hatasıyla) başarısız olup admin
      # paneline "otomasyonHatasi" uyarısı bırakmışsa, şimdi başarılıysa o
      # uyarıyı otomatik çözer — vakitVeriSagligiKontrol.ts'in KENDİ
      # ürettiği 'apiHatasi' tipinden AYRI bir mekanizma (bkz.
      # reportWorkflowSuccess.ts, "bilinçli olarak dışarıda bırakılanlar"
      # listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Vakit Veri Sağlığı Kontrolü"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Vakit Veri Sağlığı Kontrolü"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Vakit Veri Sağlığı Kontrolü"
