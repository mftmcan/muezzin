name: Aylık Ezan Takvimi Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 28 * *'

# Çakışan iki koşu, resmi Diyanet API'sinin aylık kotasını iki katına
# çıkarır (bkz. scripts/lib/diyanetResmiApi.ts) ve aynı `vakitler`
# belgesine eşzamanlı yazar. Diğer cron'lardaki AYNI desen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  takvim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Takvimi güncelle
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
          # Resmi Diyanet API'si (bkz. scripts/lib/diyanetResmiApi.ts) —
          # tanımlı değilse mevcut public zincire (emushaf/Aladhan) sessizce
          # düşülür, iş başarısız olmaz.
          DIYANET_API_EMAIL: ${{ secrets.DIYANET_API_EMAIL }}
          DIYANET_API_PASSWORD: ${{ secrets.DIYANET_API_PASSWORD }}
        run: npx tsx scripts/aylikEzanTakvimiGuncelle.ts
      # Bu iş daha önce başarısız olup admin paneline "otomasyonHatasi"
      # uyarısı bırakmışsa, şimdi başarılıysa o uyarıyı otomatik çözer
      # (bkz. reportWorkflowSuccess.ts — "bilinçli olarak dışarıda
      # bırakılanlar" listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Aylık Ezan Takvimi Güncelleme"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Aylık Ezan Takvimi Güncelleme"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Aylık Ezan Takvimi Güncelleme"
