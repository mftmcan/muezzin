name: Kota Kullanım Kontrolü

# Proje Firebase Spark planında (ücretsiz kota: 50K okuma / 20K yazma / gün)
# ve kota tükendiğinde uygulama sessizce çalışmayı durdurur — hiç kimse
# önceden haberdar olmaz (bkz. premium denetim P2.3). Bu iş, kotayı
# gerçekten patlatabilecek tek yolu (kendi kendine tekrar eden makine
# yazımları: error_logs + telemetry_logs) günde bir kez sayar ve anormal
# bir sıçramada admin paneline uyarı bırakır. Ölçüm bir TAHMİNDİR —
# gerekçesi ve sınırları scripts/kotaKontrol.ts başındaki yorumda.
on:
  workflow_dispatch:
  schedule:
    # 08:00 Türkiye saati — diğer cron'ların yoğunlaştığı gece penceresinden
    # (19:30-03:00 UTC: haftalık plan, yatsı sonu, vakit sağlığı, log
    # temizliği) bilerek uzak. 24 saatlik pencere kayan olduğundan saatin
    # kendisi ölçümü etkilemez; amaç admin'in güne uyarıyı görerek
    # başlaması.
    - cron: '0 5 * * *'

# Denetimin saydığı dört dosyaya EK olarak burada da eksikti: çakışan iki
# koşu `acikKotaUyarilariniGetir` dedup'ını (sorgu + ayrı yazım, transaction
# değil) ikisi de "açık uyarı yok" görerek atlatıp aynı gün için iki
# `kotaUyarisi` belgesi üretir. Diğer cron'lardaki AYNI desen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  kota-kontrolu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Kota kullanımını tahmin et
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        # Script eşik aşımında BAŞARISIZ OLMAZ (uyarıyı kendisi
        # adminUyarilari'na yazar) — buradaki failure() dalı yalnızca
        # gerçek script/altyapı hataları için.
        run: npm run kota:kontrol
      # Bu iş daha önce (script/altyapı hatasıyla) başarısız olup admin
      # paneline "otomasyonHatasi" uyarısı bırakmışsa, şimdi başarılıysa o
      # uyarıyı otomatik çözer — kotaKontrol.ts'in KENDİ ürettiği
      # 'kotaUyarisi' tipinden AYRI bir mekanizma (bkz. reportWorkflowSuccess.ts,
      # "bilinçli olarak dışarıda bırakılanlar" listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Kota Kullanım Kontrolü"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Kota Kullanım Kontrolü"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Kota Kullanım Kontrolü"
