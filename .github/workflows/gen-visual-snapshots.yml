name: (Geçici) Linux Görsel Baseline Üret

# Yalnızca elle tetiklenir — bkz. önceki kullanım (2026-09-13, ana ekran
# özel-vakit-banner gizleme değişikliğinden sonra baseline'ları yenilemek
# için tekrar eklendi). İşi bitince silinecek.
on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Linux Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore,auth --project muezzin-c8485 "npx playwright test tests/e2e/visual.spec.ts --update-snapshots"
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: linux-snapshots
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
