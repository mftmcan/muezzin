name: Günlük Kayıtlarını Temizle

on:
  workflow_dispatch:
  schedule:
    # Haftada bir: error_logs ve telemetry_logs'daki 30 günden eski
    # kayıtları siler (bkz. scripts/temizleGunlukler.ts). Bu, native
    # Firestore TTL policy'nin yerini tutan bir uygulama-seviyesi eşdeğerdir
    # — TTL policy Firebase Console/gcloud CLI'dan ayrıca yapılandırılabilir.
    - cron: '0 3 * * 1'

# Çakışan iki koşu aynı belgeleri silmeye çalışıp gereksiz Spark silme
# kotası harcar. Diğer cron'lardaki AYNI desen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Paketleri kur
        run: npm ci
      - name: Eski günlük kayıtlarını temizle
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npm run temizle:gunlukler
      # Bu iş daha önce başarısız olup admin paneline "otomasyonHatasi"
      # uyarısı bırakmışsa, şimdi başarılıysa o uyarıyı otomatik çözer
      # (bkz. reportWorkflowSuccess.ts — "bilinçli olarak dışarıda
      # bırakılanlar" listesinden kapatılan bulgu).
      - name: Başarıyı admin paneline bildir (önceki uyarıyı otomatik çöz)
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowSuccess.ts "Günlük Kayıtlarını Temizle"
      - name: Başarısızlığı admin paneline bildir
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MUEZZIN_C8485 }}
        run: npx tsx scripts/lib/reportWorkflowFailure.ts "Günlük Kayıtlarını Temizle"
      # UYARI_WEBHOOK_URL tanımlı değilse script sessizce atlar (bkz.
      # scripts/lib/disKanalUyari.ts) — Firestore'un kendisi arızalıysa
      # yukarıdaki adım da yazamayabilir, bu adım ondan BAĞIMSIZ bir kanaldır.
      - name: Kritik arızayı dış kanala bildir
        if: failure()
        env:
          UYARI_WEBHOOK_URL: ${{ secrets.UYARI_WEBHOOK_URL }}
        run: npx tsx scripts/lib/disKanalUyari.ts "Günlük Kayıtlarını Temizle"
